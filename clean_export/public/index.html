<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Suno Bot Admin - Christmas Edition 🎄</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Mountains+of+Christmas:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes snowfall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
            50% { transform: translateY(50vh) translateX(30px) rotate(180deg); }
            100% { transform: translateY(110vh) translateX(-30px) rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes lightsFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideIn {
            from { transform: translateX(-200%); }
            to { transform: translateX(100vw); }
        }

        .snowflake {
            position: fixed;
            top: -10vh;
            z-index: 9999;
            user-select: none;
            cursor: default;
            animation: snowfall linear infinite;
            color: #fff;
            font-size: 1.5em;
            opacity: 0.8;
            pointer-events: none;
        }

        body {
            font-family: 'Orbitron', monospace;
            background:
                radial-gradient(circle at 20% 50%, rgba(255,0,0,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0,255,0,0.15) 0%, transparent 50%),
                linear-gradient(135deg, #0a0e1a 0%, #1a0a0a 50%, #0a1a0a 100%);
            color: #00ff00;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .christmas-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                90deg,
                #ff0000 0px,
                #ff0000 20px,
                #00ff00 20px,
                #00ff00 40px,
                #ffff00 40px,
                #ffff00 60px,
                #ff0000 60px,
                #ff0000 80px
            );
            z-index: 10000;
            animation: lightsFlicker 3s infinite;
            box-shadow: 0 5px 20px rgba(255,0,0,0.5);
        }

        .santa-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 4rem;
            animation: float 3s ease-in-out infinite;
            z-index: 10000;
            filter: drop-shadow(0 0 10px #ff0000);
            cursor: pointer;
        }

        .tree-corner {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 4rem;
            animation: gentlePulse 2s ease-in-out infinite;
            z-index: 10000;
            filter: drop-shadow(0 0 10px #00ff00);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding-top: 30px;
        }

        header {
            background: linear-gradient(135deg, rgba(255,0,0,0.2) 0%, rgba(0,255,0,0.2) 100%),
                        rgba(10, 20, 30, 0.95);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255,0,0,0.3), 0 0 50px rgba(0,255,0,0.2);
            border: 3px solid #00ff00;
            position: relative;
        }

        header::before {
            content: "🎄";
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 3rem;
            animation: gentlePulse 2s ease-in-out infinite;
        }

        header::after {
            content: "🎅";
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            animation: gentlePulse 2s ease-in-out infinite 1s;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #ff0000, 5px 5px 0 #000;
            color: #fff;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Mountains of Christmas', cursive;
            text-align: center;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #ffff00;
            text-shadow: 3px 3px 0 #000, 0 0 15px #ffff00;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            font-family: 'Mountains of Christmas', cursive;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255,0,0,0.1) 0%, rgba(0,255,0,0.1) 100%),
                        rgba(10, 20, 30, 0.98);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.3), inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .card::before {
            content: "🎄";
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 2rem;
            opacity: 0.2;
            animation: gentlePulse 3s ease-in-out infinite;
        }

        .card h2 {
            color: #00ff00;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 15px;
            text-shadow: 3px 3px 8px #000, 0 0 15px #00ff00;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid rgba(0,255,0,0.3);
            background: rgba(0,0,0,0.5);
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
            transition: all 0.3s;
        }

        .metric:hover {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.4);
        }

        .metric span {
            font-weight: 700;
            text-shadow: 2px 2px 4px #000;
        }

        .metric-value {
            font-weight: 900;
            color: #ff0000;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #fff, 3px 3px 0 #000;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            color: #ffff00;
            font-weight: 700;
            text-shadow: 3px 3px 0 #000, 0 0 10px #ffff00;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            color: #00ff00;
            font-size: 1.1rem;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,255,0,0.3), inset 0 0 10px rgba(0,255,0,0.1);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 25px rgba(255,0,0,0.6), inset 0 0 15px rgba(255,0,0,0.2);
            background: rgba(0, 0, 0, 0.95);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Orbitron', monospace;
        }

        button {
            background: linear-gradient(135deg, #ff0000 0%, #00ff00 100%);
            color: #000;
            border: 3px solid #fff;
            padding: 18px 40px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 900;
            font-family: 'Mountains of Christmas', cursive;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255,0,0,0.5), 0 5px 15px rgba(0,0,0,0.7);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px rgba(255,0,0,0.8), 0 10px 25px rgba(0,0,0,0.9);
            background: linear-gradient(135deg, #00ff00 0%, #ff0000 100%);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        button.secondary {
            background: linear-gradient(135deg, #ffff00 0%, #00ffff 100%);
        }

        button.secondary:hover {
            background: linear-gradient(135deg, #00ffff 0%, #ffff00 100%);
        }

        .log-container {
            background: rgba(0, 0, 0, 0.95);
            padding: 25px;
            border-radius: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.4), inset 0 0 20px rgba(0,255,0,0.2);
        }

        .log-container::-webkit-scrollbar {
            width: 14px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: linear-gradient(#ff0000, #00ff00);
            border-radius: 8px;
            border: 2px solid #000;
        }

        .log-entry {
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #00ff00;
            padding-left: 18px;
            background: rgba(0,255,0,0.1);
            border-radius: 6px;
        }

        .log-entry.info {
            border-left-color: #00ff00;
            background: rgba(0,255,0,0.15);
        }

        .log-entry.warn {
            border-left-color: #ffff00;
            background: rgba(255,255,0,0.15);
        }

        .log-entry.error {
            border-left-color: #ff0000;
            background: rgba(255,0,0,0.15);
        }

        .log-timestamp {
            color: #ffff00;
            margin-right: 10px;
            font-weight: 700;
        }

        .links-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .links-list::-webkit-scrollbar {
            width: 14px;
        }

        .links-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
        }

        .links-list::-webkit-scrollbar-thumb {
            background: linear-gradient(#ff0000, #00ff00);
            border-radius: 8px;
            border: 2px solid #000;
        }

        .link-item {
            padding: 20px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, rgba(255,0,0,0.2) 0%, rgba(0,255,0,0.2) 100%),
                        rgba(0,0,0,0.7);
            border-radius: 12px;
            border: 2px solid rgba(0,255,0,0.3);
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
            transition: all 0.3s;
        }

        .link-item:hover {
            border-color: #00ff00;
            box-shadow: 0 0 25px rgba(0,255,0,0.5);
            transform: translateX(5px);
        }

        .link-title {
            font-weight: 900;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 3px 3px 0 #000, 0 0 10px #00ff00;
            font-size: 1.3rem;
        }

        .link-url {
            font-size: 0.95rem;
            color: #00ff00;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            text-shadow: 1px 1px 0 #000;
        }

        .link-time {
            font-size: 0.9rem;
            color: #ffff00;
            margin-top: 8px;
            font-weight: 700;
        }

        .status-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 2s infinite;
            box-shadow: 0 0 15px #00ff00;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .success-message {
            background: linear-gradient(90deg, #00ff00, #ffff00, #00ff00);
            color: #000;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: none;
            font-weight: 900;
            text-align: center;
            border: 3px solid #fff;
            box-shadow: 0 0 30px rgba(0,255,0,0.8);
            font-size: 1.3rem;
        }

        .success-message.show {
            display: block;
            animation: gentlePulse 0.5s;
        }

        .elf-mascot {
            position: fixed;
            font-size: 3rem;
            animation: slideIn 25s linear infinite;
            z-index: 9998;
            filter: drop-shadow(0 0 15px rgba(0,255,0,0.8));
            top: 50%;
        }
    </style>
</head>
<body>
    <div class="christmas-lights"></div>
    <div class="santa-corner" onclick="alert('🎅🎄 HO HO HO! Merry Christmas! 🎄🎅')">🎅</div>
    <div class="tree-corner">🎄</div>

    <div class="container">
        <header>
            <h1>🎄 Suno Bot Admin 🎄</h1>
            <p class="subtitle">⚡ Arc Raiders Christmas Edition ⚡</p>
        </header>

        <div class="grid">
            <!-- Metrics Card -->
            <div class="card">
                <h2>
                    <span class="status-indicator"></span>
                    System Metrics
                </h2>
                <div class="metric">
                    <span>🎵 Total Plays</span>
                    <span class="metric-value" id="totalPlays">0</span>
                </div>
                <div class="metric">
                    <span>💬 Chat Messages</span>
                    <span class="metric-value" id="chatMessages">0</span>
                </div>
                <div class="metric">
                    <span>🔊 TTS Requests</span>
                    <span class="metric-value" id="ttsRequests">0</span>
                </div>
                <div class="metric">
                    <span>⏱️ Uptime</span>
                    <span class="metric-value" id="uptime">0m</span>
                </div>
                <div class="button-group">
                    <button class="secondary" onclick="resetMetrics()">Reset Metrics</button>
                </div>
            </div>

            <!-- System Prompt Control -->
            <div class="card">
                <h2>⚙️ Bot Configuration</h2>
                <div id="configSuccess" class="success-message">🎄 Configuration Saved! 🎄</div>
                <form onsubmit="saveConfig(event)">
                    <div class="form-group">
                        <label for="systemPrompt">System Prompt</label>
                        <textarea id="systemPrompt" placeholder="You are a helpful assistant..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="voiceSelect">TTS Voice</label>
                        <select id="voiceSelect">
                            <option value="alloy">🎵 Alloy</option>
                            <option value="echo">🔊 Echo</option>
                            <option value="fable">📖 Fable</option>
                            <option value="onyx">⚫ Onyx</option>
                            <option value="nova">✨ Nova</option>
                            <option value="shimmer">💫 Shimmer</option>
                        </select>
                    </div>
                    <button type="submit">Save Config</button>
                </form>
            </div>
        </div>

        <!-- Recently Played Links -->
        <div class="card">
            <h2>🎶 Recently Played</h2>
            <div class="links-list" id="linksList">
                <p style="color: #ffff00; text-align: center; padding: 30px; font-size: 1.2rem; font-weight: 700;">🎄 No tracks played yet 🎄</p>
            </div>
        </div>

        <!-- Logs -->
        <div class="card">
            <h2>📋 System Logs</h2>
            <div class="button-group" style="margin-bottom: 20px;">
                <button class="secondary" onclick="refreshLogs()">🔄 Refresh</button>
                <button class="secondary" onclick="clearLogs()">🗑️ Clear Logs</button>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-entry info">
                    <span class="log-timestamp">SYSTEM</span>
                    <span>Waiting for logs...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create gentle snowfall
        function createSnowflakes() {
            const snowflakes = ['❄️', '⛄', '🎄', '🎁', '⭐'];
            for (let i = 0; i < 20; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDuration = (Math.random() * 5 + 8) + 's';
                snowflake.style.animationDelay = Math.random() * 8 + 's';
                snowflake.style.fontSize = (Math.random() * 1 + 1) + 'em';
                document.body.appendChild(snowflake);
            }
        }

        // Create occasional elf
        function createElfMascot() {
            const elf = document.createElement('div');
            elf.className = 'elf-mascot';
            elf.textContent = Math.random() > 0.5 ? '🧝‍♂️' : '🧝‍♀️';
            document.body.appendChild(elf);
        }

        createSnowflakes();
        createElfMascot();

        // Auto-refresh
        let autoRefresh;

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}d ${hours % 24}h`;
            if (hours > 0) return `${hours}h ${minutes % 60}m`;
            if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
            return `${seconds}s`;
        }

        async function loadMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();

                document.getElementById('totalPlays').textContent = data.totalPlays;
                document.getElementById('chatMessages').textContent = data.chatMessages;
                document.getElementById('ttsRequests').textContent = data.ttsRequests;
                document.getElementById('uptime').textContent = formatUptime(data.uptime);

                const linksList = document.getElementById('linksList');
                if (data.linksPlayed && data.linksPlayed.length > 0) {
                    linksList.innerHTML = data.linksPlayed.reverse().map(link => `
                        <div class="link-item">
                            <div class="link-title">🎵 ${link.title || 'Unknown Track'}</div>
                            <div class="link-url">🔗 ${link.url}</div>
                            <div class="link-time">⏰ ${new Date(link.timestamp).toLocaleString()}</div>
                        </div>
                    `).join('');
                } else {
                    linksList.innerHTML = '<p style="color: #ffff00; text-align: center; padding: 30px; font-size: 1.2rem; font-weight: 700;">🎄 No tracks played yet 🎄</p>';
                }
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        async function loadLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();

                const logContainer = document.getElementById('logContainer');
                if (data.logs && data.logs.length > 0) {
                    logContainer.innerHTML = data.logs.map(log => `
                        <div class="log-entry ${log.level}">
                            <span class="log-timestamp">${new Date(log.timestamp).toLocaleTimeString()}</span>
                            <span>${log.message}</span>
                        </div>
                    `).join('');
                    logContainer.scrollTop = logContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();

                document.getElementById('systemPrompt').value = data.systemPrompt;
                document.getElementById('voiceSelect').value = data.currentVoice;
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        async function saveConfig(event) {
            event.preventDefault();

            const systemPrompt = document.getElementById('systemPrompt').value;
            const currentVoice = document.getElementById('voiceSelect').value;

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemPrompt, currentVoice })
                });

                if (response.ok) {
                    const successMsg = document.getElementById('configSuccess');
                    successMsg.classList.add('show');
                    setTimeout(() => successMsg.classList.remove('show'), 3000);
                }
            } catch (error) {
                console.error('Error saving config:', error);
                alert('❌ Error saving configuration');
            }
        }

        async function clearLogs() {
            if (!confirm('🎄 Clear all logs?')) return;

            try {
                await fetch('/api/clear-logs', { method: 'POST' });
                loadLogs();
            } catch (error) {
                console.error('Error clearing logs:', error);
            }
        }

        async function resetMetrics() {
            if (!confirm('🎄 Reset all metrics?')) return;

            try {
                await fetch('/api/reset-metrics', { method: 'POST' });
                loadMetrics();
            } catch (error) {
                console.error('Error resetting metrics:', error);
            }
        }

        function refreshLogs() {
            loadLogs();
        }

        function startAutoRefresh() {
            loadMetrics();
            loadLogs();
            loadConfig();

            autoRefresh = setInterval(() => {
                loadMetrics();
                loadLogs();
            }, 5000);
        }

        startAutoRefresh();
    </script>
</body>
</html>
